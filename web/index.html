<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <!-- TEMPORARY theme comparison: ?theme=a|b|c or the saved choice, default a. Remove with ThemeSwitcher. -->
    <script>
      (function () {
        var theme = "a";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var saved = localStorage.getItem("fantasy-theme");
          if (q && /^[abc]$/.test(q)) { theme = q; localStorage.setItem("fantasy-theme", q); }
          else if (saved && /^[abc]$/.test(saved)) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Fantasy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
