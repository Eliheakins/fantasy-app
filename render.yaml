services:
  # FastAPI backend — Parquet index + optional /data static files
  - type: web
    name: nfl-stat-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: nfl-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATA_LOCAL_DIR
        value: /data
      - key: POLARS_MAX_THREADS
        value: "1"
      - key: RAYON_NUM_THREADS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: DATA_SOURCE
        value: local
      - key: OPENAI_API_KEY
        sync: false

  # Vite + React frontend (build-time API URL — set at Blueprint setup)
  - type: web
    name: nfl-stat-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
