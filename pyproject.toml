# Ruff: lint + format for backend Python (run from repo root).
# Install: pip install ruff   or   pip install -r dev-requirements.txt

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  "venv",
  ".venv",
  "node_modules",
  "frontend",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
