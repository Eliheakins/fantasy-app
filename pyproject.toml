[project]
name = "nfl-stat-app"
version = "0.1.0"
description = "Local NFL analytics workbench (The Bridge): FastAPI backend, DuckDB-WASM frontend."
requires-python = ">=3.12"
dependencies = [
  # --- API ---
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.40.0",  # client for the local OpenAI-compatible MLX server
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  # --- Data + pipeline ---
  "polars>=1.0.0",
  "pyarrow>=15.0.0",
  "nflreadpy>=0.1.0",
]

[dependency-groups]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "duckdb>=1.0.0",  # ad hoc checks against the shards (backend/scripts/dev)
]

# Apple Silicon only: `uv run --group llm mlx_lm.server --model <LLM_MODEL>`
llm = ["mlx-lm"]

[tool.uv]
# Scripts and a FastAPI app, not an installable package.
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["eval: runs against the live local model (deselected by default)"]
addopts = "-m 'not eval'"

[tool.coverage.run]
source = ["backend"]
# The data build needs the network, and scripts and tests are not product code.
omit = ["backend/pipeline/*", "backend/scripts/*", "backend/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".git",
  "venv",
  ".venv",
  "node_modules",
  "frontend",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"backend/pipeline/*" = ["E501"]  # long prose in column manifests and docstrings
"backend/scripts/*" = ["E402"]   # sys.path is adjusted before the import

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "pipeline", "schemas", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
