blend_sources = ["sleeper", "fftoday", "props"]
prop_positions = ["RB", "WR"]  # QB and TE props were not significant (docs/decisions.md)
inactive_swap = true  # start Q/D players by E when a later bench swap exists (docs/decisions.md)
ir_return_curve = true  # IR players follow the measured return curve (docs/decisions.md)

