name: ci

# The same checks as `make check`. Runs on pull requests and is called by deploy.yml before a deploy.
# No secrets here: this job must stay safe to run on code from a fork.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: npm ci --ignore-scripts
        working-directory: web
      # Same commands as the Makefile's `check` target (CI has no data/ or .env; tests use tmp stores)
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
